<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="900" height="1120" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111111">PRISMA-ScR flow diagram</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#555555">Phage–antibiotic synergy in ESKAPE pathogens: a scoping review of antibiotic-partner selection</text>

  <!-- ================= IDENTIFICATION ================= -->
  <rect x="4" y="68" width="780" height="180" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="16" y="86" font-size="11" font-weight="bold" fill="#666666" letter-spacing="1">IDENTIFICATION</text>

  <rect x="60" y="98" width="300" height="92" rx="4" fill="#eef3f8" stroke="#7a9cbd" stroke-width="1.5"/>
  <text x="210" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Records identified</text>
  <text x="210" y="138" text-anchor="middle" font-size="10.5" fill="#333333">Europe PMC (includes MEDLINE/PubMed)</text>
  <text x="210" y="155" text-anchor="middle" font-size="10.5" fill="#333333">6 organism queries, 2015–2026</text>
  <text x="210" y="176" text-anchor="middle" font-size="10.5" fill="#333333">Free-text search; no MeSH terms</text>

  <line x1="210" y1="190" x2="210" y2="212" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="214" width="300" height="30" rx="4" fill="#eef3f8" stroke="#7a9cbd" stroke-width="1.5"/>
  <text x="70" y="233" font-size="11" font-weight="bold" fill="#1a1a1a">Unique after deduplication</text>
  <text x="350" y="233" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">n = 4,402</text>

  <!-- ================= SCREENING ================= -->
  <rect x="4" y="248" width="780" height="290" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="16" y="266" font-size="11" font-weight="bold" fill="#666666" letter-spacing="1">SCREENING</text>

  <line x1="210" y1="244" x2="210" y2="286" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="288" width="300" height="86" rx="4" fill="#eef3f8" stroke="#7a9cbd" stroke-width="1.5"/>
  <text x="210" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Weighted relevance score applied</text>
  <text x="210" y="325" text-anchor="middle" font-size="10.5" fill="#333333">to title + abstract (range −99 to +24)</text>
  <text x="210" y="342" text-anchor="middle" font-size="10.5" fill="#333333">Weights fixed a priori; deterministic</text>
  <text x="210" y="363" text-anchor="middle" font-size="10.5" fill="#333333">Single reviewer; uncalibrated</text>

  <line x1="360" y1="331" x2="440" y2="331" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="444" y="276" width="330" height="116" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="609" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Records excluded at triage</text>
  <text x="609" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">n = 4,148</text>
  <text x="458" y="337" font-size="10.5" fill="#333333">Score below threshold of 14:</text>
  <text x="458" y="353" font-size="10.5" fill="#333333">2,398 scored −99 (no phage content)</text>
  <text x="458" y="369" font-size="10.5" fill="#333333">1,750 scored −98 to 13</text>
  <text x="458" y="385" font-size="9.5" fill="#777777">Sensitivity: cut 12 → 403; cut 16 → 151</text>

  <line x1="210" y1="374" x2="210" y2="404" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="406" width="300" height="30" rx="4" fill="#eef3f8" stroke="#7a9cbd" stroke-width="1.5"/>
  <text x="70" y="425" font-size="11" font-weight="bold" fill="#1a1a1a">Prioritised for retrieval</text>
  <text x="350" y="425" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">n = 254</text>

  <line x1="210" y1="436" x2="210" y2="466" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="468" width="300" height="30" rx="4" fill="#ffffff" stroke="#7a9cbd" stroke-width="1.5"/>
  <text x="70" y="487" font-size="11" font-weight="bold" fill="#1a1a1a">Full text assessed</text>
  <text x="350" y="487" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">n = 210</text>

  <line x1="360" y1="483" x2="440" y2="483" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="444" y="458" width="330" height="50" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="609" y="477" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Full text not obtained — n = 44</text>
  <text x="609" y="495" text-anchor="middle" font-size="9.8" fill="#555555">assessed on abstract only (221 had PMCID)</text>

  <!-- ================= ELIGIBILITY ================= -->
  <rect x="4" y="552" width="780" height="196" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="16" y="570" font-size="11" font-weight="bold" fill="#666666" letter-spacing="1">ELIGIBILITY</text>

  <line x1="210" y1="498" x2="210" y2="592" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="594" width="300" height="30" rx="4" fill="#ffffff" stroke="#7a9cbd" stroke-width="1.5"/>
  <text x="70" y="613" font-size="11" font-weight="bold" fill="#1a1a1a">Records assessed for eligibility</text>
  <text x="350" y="613" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">n = 254</text>

  <line x1="360" y1="609" x2="440" y2="609" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="444" y="586" width="330" height="148" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="609" y="606" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Records excluded</text>
  <text x="609" y="626" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">n = 97</text>
  <text x="458" y="648" font-size="10.5" fill="#333333">No antibiotic in a phage-combination</text>
  <text x="458" y="663" font-size="10.5" fill="#333333">   context — n = 77</text>
  <text x="458" y="682" font-size="10.5" fill="#333333">Review prose, no primary experiment</text>
  <text x="458" y="697" font-size="10.5" fill="#333333">   — n = 20</text>
  <text x="458" y="713" font-size="9.5" fill="#777777">Also available, n = 0 each: review-type title;</text>
  <text x="458" y="726" font-size="9.5" fill="#777777">no phage content; no assignable ESKAPE organism</text>

  <line x1="210" y1="624" x2="210" y2="668" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="670" width="300" height="56" rx="4" fill="#dfeadf" stroke="#5f8a5f" stroke-width="1.8"/>
  <text x="210" y="692" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Studies included</text>
  <text x="210" y="714" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">n = 157</text>

  <!-- ================= INCLUDED ================= -->
  <rect x="4" y="772" width="780" height="330" fill="none" stroke="#cccccc" stroke-width="1"/>
  <text x="16" y="790" font-size="11" font-weight="bold" fill="#666666" letter-spacing="1">INCLUDED</text>

  <line x1="210" y1="726" x2="210" y2="810" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="812" width="300" height="30" rx="4" fill="#ffffff" stroke="#5f8a5f" stroke-width="1.5"/>
  <text x="70" y="831" font-size="11" font-weight="bold" fill="#1a1a1a">Antibiotic-level observations</text>
  <text x="350" y="831" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">n = 419</text>

  <line x1="210" y1="842" x2="210" y2="874" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="876" width="300" height="30" rx="4" fill="#dfeadf" stroke="#5f8a5f" stroke-width="1.8"/>
  <text x="70" y="895" font-size="11" font-weight="bold" fill="#1a1a1a">Determinate outcome</text>
  <text x="350" y="895" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">n = 272 (64.9%)</text>

  <line x1="360" y1="891" x2="440" y2="891" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="444" y="866" width="330" height="50" rx="4" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/>
  <text x="609" y="885" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Indeterminate — n = 147 (35.1%)</text>
  <text x="609" y="903" text-anchor="middle" font-size="9.8" fill="#555555">excluded from all pooled proportions</text>

  <line x1="210" y1="906" x2="210" y2="942" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="60" y="944" width="300" height="86" rx="4" fill="#dfeadf" stroke="#5f8a5f" stroke-width="1.8"/>
  <text x="210" y="964" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Outcome of the 272 determinate calls</text>
  <text x="210" y="985" text-anchor="middle" font-size="10.5" fill="#333333">Synergy 232 (85.3%) · Indifferent 21 (7.7%)</text>
  <text x="210" y="1002" text-anchor="middle" font-size="10.5" fill="#333333">Additive 4 (1.5%) · Antagonistic 15 (5.5%)</text>
  <text x="210" y="1021" text-anchor="middle" font-size="9.8" fill="#555555">from 105 study–organism entries</text>

  <rect x="444" y="944" width="330" height="94" rx="4" fill="#f7f2e4" stroke="#a08c50" stroke-width="1.3"/>
  <text x="609" y="964" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Analysis subsets</text>
  <text x="609" y="983" text-anchor="middle" font-size="9.8" fill="#333333">Design-based: 50 studies / 209 observations</text>
  <text x="609" y="999" text-anchor="middle" font-size="9.8" fill="#333333">Head-to-head paired: 23 studies</text>
  <text x="609" y="1015" text-anchor="middle" font-size="9.8" fill="#333333">Outcome-selected: 17 studies (exploratory only)</text>
  <text x="609" y="1027" text-anchor="middle" font-size="9.5" fill="#777777">reconciliation: 254 = 157 included + 97 excluded</text>

</svg>
